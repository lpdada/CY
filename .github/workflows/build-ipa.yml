name: Build unsigned IPA

# Produces an unsigned .ipa that can be re-signed and sideloaded (Sideloadly,
# AltStore, ...). Signing is stripped on purpose: there is no team certificate
# here, and the sideloading tool supplies its own.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode configuration"
        required: false
        default: "Release"

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ./VivaDicta.xcodeproj/project.xcworkspace \
            -scheme VivaDicta

      # `build` into the products dir only assembles resources for a device
      # destination here: the .app came out without Info.plist, binary or
      # PlugIns. `archive` always assembles the complete bundle, and with
      # signing disabled it still does so without a team certificate.
      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VivaDicta.xcodeproj \
            -scheme VivaDicta \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath build/VivaDicta.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build.log | xcbeautify
          tail -n 400 build.log > build-tail.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/VivaDicta.xcarchive/Products/Applications/VivaDicta.app"
          if [ ! -d "$APP" ]; then
            echo "No app bundle inside the archive" >&2
            find build/VivaDicta.xcarchive -maxdepth 4 -name '*.app' >&2 || true
            exit 1
          fi
          # An .app missing any of these is not installable; fail loudly instead
          # of uploading a broken IPA.
          for f in Info.plist VivaDicta PlugIns; do
            if [ ! -e "$APP/$f" ]; then
              echo "Archive is missing $f in $APP" >&2
              ls -la "$APP" >&2
              exit 1
            fi
          done
          echo "App bundle: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          echo "Extensions:"; ls "$APP/PlugIns"
          # 自签瘦身：免费账号签不了 Watch / Widget / 分享 / 操作扩展，
          # 留在包里会让 Sideloadly 重签失败或装到一半报错。只保留主 App
          # 本体 + 键盘扩展，Watch App 的目录一并剔除。
          find "$APP/PlugIns" -maxdepth 1 -mindepth 1 -type d ! -name 'VivaDictaKeyboard.appex' -exec rm -rf {} +
          rm -rf "$APP/Watch"
          echo "Extensions after slimming:"; ls "$APP/PlugIns"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VivaDicta-unsigned.ipa Payload
          ls -lh VivaDicta-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VivaDicta-unsigned-ipa
          path: VivaDicta-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log (only useful on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-tail.log
          if-no-files-found: ignore
