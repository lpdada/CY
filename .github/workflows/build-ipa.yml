name: Build unsigned IPA

# Produces an unsigned .ipa that can be re-signed and sideloaded (Sideloadly,
# AltStore, ...). Signing is stripped on purpose: there is no team certificate
# here, and the sideloading tool supplies its own.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode configuration"
        required: false
        default: "Release"

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ./VivaDicta.xcodeproj/project.xcworkspace \
            -scheme VivaDicta

      - name: Build for device without signing
        run: |
          xcodebuild build \
            -scheme VivaDicta \
            -workspace ./VivaDicta.xcodeproj/project.xcworkspace \
            -destination 'generic/platform=iOS' \
            -configuration "${{ inputs.configuration }}" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build.log | xcbeautify
          # Keep the tail of the log for the artifact: when a build fails, the
          # interesting part is the error, not the 20k lines before it.
          tail -n 400 build.log > build-tail.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          PRODUCTS="build/Build/Products/${{ inputs.configuration }}-iphoneos"
          APP=$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -not -name '*Tests.app' | head -1)
          if [ -z "$APP" ]; then
            echo "No .app produced in $PRODUCTS" >&2
            ls -la "$PRODUCTS" >&2 || true
            exit 1
          fi
          echo "App bundle: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VivaDicta-unsigned.ipa Payload
          ls -lh VivaDicta-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VivaDicta-unsigned-ipa
          path: VivaDicta-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log (only useful on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-tail.log
          if-no-files-found: ignore
